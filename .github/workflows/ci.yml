name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile check
        run: python -m compileall -q iccprint scripts main.py tests
      - name: Unit and headless integration tests
        run: python -m unittest discover -s tests -v
      - name: Exercise application native dependencies
        run: python scripts/frozen_entry.py --smoke-test smoke-test.json
      - name: Record installed versions
        run: python -m pip freeze --all
