[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iccprint"
version = "0.2.0"
description = "A Windows ICC-managed printing utility with soft proofing and explicit rendering intents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "ICCPrint contributors" }
]
keywords = ["icc", "printing", "color-management", "soft-proof", "littlecms", "printer-profile"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Printing",
]
dependencies = [
  "PySide6>=6.8,<7",
  "Pillow>=12.0,<13",
  "pypdfium2>=5.0,<6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
iccprint = "iccprint.__main__:main"

[tool.setuptools]
packages = ["iccprint"]
